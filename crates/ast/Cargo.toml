[package]
name = "asmanite-ast"
description = "Lexer, parser and tokens for the asmanite language"
repository.workspace = true
categories.workspace = true
keywords  .workspace = true
authors   .workspace = true
version   .workspace = true
edition   .workspace = true
license   .workspace = true

# This crate is dedicated to parsing the Asmanite syntax.
# It could be repurposed to provide syntax highlihting,
# code formatting and other tasks related to syntax.
# As such, it is distinct from raw code producers.

[dependencies]

# Common
thiserror.workspace = true
asmanite-common = { path = "../common" }

# Lexer & Parser
logos   = "0.16"
chumsky = { version = "0.13", features = ["pratt" ] }
strum   = { version = "0.28", features = ["derive"] }
