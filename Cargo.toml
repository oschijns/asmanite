[workspace]
members = [
    "crates/model",
    "crates/compiler",
]
resolver = "2"

[workspace.package]
description = "High-level assembly language"
authors = ["Olivier Schyns <https://github.com/oschijns>"]
repository = "https://github.com/oschijns/asmanite"
keywords = ["asm"]
categories = ["asm"]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]

# Report errors
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
